<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    html, body { margin: 0; width: 1280px; height: 800px; overflow: hidden; }
    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #1c1a22;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .stage { text-align: center; }
    .caption {
      color: #cfc8b8;
      font-size: 15px;
      margin-bottom: 22px;
      letter-spacing: 0.02em;
    }
    .popup {
      width: 340px;
      margin: 0 auto;
      background: #f8f9fa;
      color: #1a1a1a;
      border-radius: 16px;
      padding: 18px 16px 16px;
      text-align: left;
      box-shadow: 0 24px 60px rgba(0,0,0,0.45);
    }
    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
    .mark {
      width: 28px; height: 28px; border-radius: 7px;
      background: linear-gradient(135deg, #f0d36a, #c9a227);
    }
    h1 { font-size: 16px; margin: 0; }
    .tag { font-size: 11px; color: #5b4b8a; margin: 0; }
    .host { font-size: 11px; color: #666; margin: 8px 0 12px; }
    .card {
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 10px;
    }
    .row { display: flex; align-items: center; gap: 8px; padding: 3px 0; font-size: 12px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #2ea043; }
    .toggle {
      display: flex; align-items: center; justify-content: space-between;
      font-size: 13px; font-weight: 600;
    }
    .sw { width: 40px; height: 22px; background: #2ea043; border-radius: 11px; position: relative; }
    .sw::after {
      content: ""; position: absolute; top: 2px; left: 20px;
      width: 18px; height: 18px; background: #fff; border-radius: 50%;
    }
    .btn {
      width: 100%; border: 0; border-radius: 8px; padding: 10px 12px;
      background: #0969da; color: #fff; font-weight: 600; font-size: 13px;
    }
    .sites { font-size: 11px; color: #444; line-height: 1.55; }
    .sites b { display: block; font-size: 12px; color: #1a1a1a; margin-bottom: 4px; }
  </style>
</head>
<body>
  <div class="stage">
    <div class="caption">Toolbar popup — English labels</div>
    <div class="popup">
      <div class="brand">
        <div class="mark"></div>
        <div>
          <h1>Banablur</h1>
          <p class="tag">Peel the blur.</p>
        </div>
      </div>
      <div class="host">xvideos.com</div>
      <div class="card">
        <div class="row"><span class="dot"></span> Profiles: xvideos</div>
        <div class="row"><span class="dot"></span> Watchdog: on</div>
        <div class="row"><span class="dot"></span> Threat: none</div>
        <div class="row"><span class="dot"></span> Video: playing</div>
      </div>
      <div class="card toggle">
        <span>Auto cleanup</span>
        <div class="sw"></div>
      </div>
      <button class="btn">Force detect + clean</button>
      <div class="card sites" style="margin-top:10px">
        <b>Supported sites</b>
        XVIDEOS · XNXX · xHamster · Chaturbate · Tukif · Teen21 · and more
      </div>
    </div>
  </div>
</body>
</html>
